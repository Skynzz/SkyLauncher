[package]
name = "SkyLauncher"
version = "1.2.0"
description = "SkyLauncher — Modern, Fast & Modular Minecraft Launcher"
authors = ["SkyLauncher"]
edition = "2021"
default-run = "SkyLauncher"

[lib]
name = "sky_launcher_lib"
crate-type = ["rlib"]

[[bin]]
name = "SkyLauncher"
path = "src/main.rs"

[[bin]]
name = "SkyLauncher-Setup"
path = "src/setup_main.rs"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1.11", features = ["v3", "v4", "serde"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
toml = "0.8"
notify = "6.1"
regex = "1.11"
sysinfo = "0.32"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hex = "0.4"
once_cell = "1.20"
parking_lot = "0.12"

[profile.dev]
strip = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
